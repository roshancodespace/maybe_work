<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Automator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <header class="top-nav">
    <div class="nav-start">
      <div class="app-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="3" ry="3"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
        <span class="app-name">Automator</span>
      </div>
      <div class="device-pill">
        <select id="deviceSelect" class="clean-select"></select>
        <span id="deviceStatusBadge" class="badge badge-offline">Offline</span>
        <span id="deviceSpecs" class="device-meta"></span>
      </div>
    </div>

    <div class="nav-end">
      <div class="status-chip">
        <span class="status-indicator-dot" id="stateDot"></span>
        <span id="stateLabel" class="status-name">IDLE</span>
      </div>
      <div class="action-buttons">
        <button id="btnStart" class="btn btn-primary">Start</button>
        <button id="btnPause" class="btn btn-tonal" disabled>Pause</button>
        <button id="btnResume" class="btn btn-tonal" style="display:none;">Resume</button>
        <button id="btnStop" class="btn btn-danger" disabled>Stop</button>
      </div>
    </div>
  </header>

  <section class="stats-row">
    <div class="stat-item">
      <div class="stat-label">Workflow</div>
      <div id="metricCurrentWf" class="stat-value">—</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Task</div>
      <div id="metricCurrentTask" class="stat-value truncate">—</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Repetition</div>
      <div id="metricRep" class="stat-value">0 / 0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Queue</div>
      <div id="metricQueue" class="stat-value">0 / 0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Elapsed</div>
      <div id="metricElapsed" class="stat-value mono">0.0s</div>
    </div>
  </section>

  <main class="content-grid">
    <div class="panel panel-config">
      <div class="tab-header">
        <button id="tabBtnScheduler" class="tab-button active">Queue & Settings</button>
        <button id="tabBtnWorkflows" class="tab-button">Workflow Editor</button>
      </div>

      <div id="tabContentScheduler" class="tab-view active">
        <div class="card">
          <div class="card-bar">
            <div>
              <div class="card-title">Run Queue</div>
              <div class="card-subtitle">Workflows run in this sequence</div>
            </div>
            <button id="btnAddQueueItem" class="btn btn-sm btn-tonal">+ Add Workflow</button>
          </div>
          <div id="queueList" class="item-list"></div>
        </div>

        <div class="card">
          <div class="card-bar">
            <div class="card-title">Timing Rules</div>
          </div>
          <div class="grid-fields">
            <div class="field">
              <label for="interRepDelay">Between repetitions (s)</label>
              <input type="number" id="interRepDelay" class="input-text" min="0" step="0.5" value="2.0">
            </div>
            <div class="field">
              <label for="interWfDelay">Between workflows (s)</label>
              <input type="number" id="interWfDelay" class="input-text" min="0" step="0.5" value="4.0">
            </div>
            <div class="field">
              <label for="cooldownInterval">Cooldown interval (every N reps)</label>
              <input type="number" id="cooldownInterval" class="input-text" min="0" value="3">
            </div>
            <div class="field">
              <label for="cooldownDuration">Cooldown length (s)</label>
              <input type="number" id="cooldownDuration" class="input-text" min="0" step="1" value="8.0">
            </div>
            <div class="field full-width">
              <label for="maxDuration">Time limit (seconds, 0 for none)</label>
              <input type="number" id="maxDuration" class="input-text" min="0" step="10" value="900">
            </div>
          </div>
          <div class="card-footer">
            <button id="btnSaveScheduler" class="btn btn-sm btn-tonal">Save Rules</button>
          </div>
        </div>
      </div>

      <div id="tabContentWorkflows" class="tab-view">
        <div class="card">
          <div class="card-bar">
            <div class="select-group">
              <label for="wfSelect">Select Workflow</label>
              <select id="wfSelect" class="clean-select"></select>
            </div>
            <div class="button-group">
              <button id="btnNewWorkflow" class="btn btn-sm btn-tonal">New</button>
              <button id="btnDuplicateWorkflow" class="btn btn-sm btn-tonal">Copy</button>
              <button id="btnDeleteWorkflow" class="btn btn-sm btn-text-danger">Delete</button>
            </div>
          </div>

          <div class="grid-fields">
            <div class="field full-width">
              <label for="wfName">Name</label>
              <input type="text" id="wfName" class="input-text">
            </div>
            <div class="field full-width">
              <label for="wfDesc">Description</label>
              <input type="text" id="wfDesc" class="input-text">
            </div>
            <div class="field">
              <label for="wfPreset">Behavior Style</label>
              <select id="wfPreset" class="clean-select">
                <option value="consistent">Consistent</option>
                <option value="natural" selected>Natural (Humanized)</option>
                <option value="exploratory">Exploratory</option>
              </select>
            </div>
            <div class="field">
              <label for="wfRepetitions">Default Repetitions</label>
              <input type="number" id="wfRepetitions" class="input-text" min="1" value="1">
            </div>
          </div>

          <details class="simple-accordion">
            <summary>Randomization & Timing</summary>
            <div class="accordion-body">
              <div class="grid-fields">
                <div class="field">
                  <label>Delay range (s)</label>
                  <div class="inline-range">
                    <input type="number" id="randDelayMin" class="input-text" min="0.2" step="0.1" value="1.0">
                    <span>–</span>
                    <input type="number" id="randDelayMax" class="input-text" min="0.5" step="0.1" value="2.5">
                  </div>
                </div>
                <div class="field">
                  <label>Scroll distance (% screen)</label>
                  <div class="inline-range">
                    <input type="number" id="randScrollMin" class="input-text" min="0.1" max="0.9" step="0.05"
                      value="0.30">
                    <span>–</span>
                    <input type="number" id="randScrollMax" class="input-text" min="0.1" max="0.9" step="0.05"
                      value="0.65">
                  </div>
                </div>
                <div class="field">
                  <label>Pause probability (%)</label>
                  <input type="number" id="randPauseChance" class="input-text" min="0" max="100" value="25">
                </div>
                <div class="field center-field">
                  <label class="toggle-row">
                    <input type="checkbox" id="randWiggleEnabled" checked>
                    <span>Randomized micro-scrolls</span>
                  </label>
                </div>
              </div>
            </div>
          </details>
        </div>

        <div class="card">
          <div class="card-bar">
            <div>
              <div class="card-title">Tasks (<span id="taskCount">0</span>)</div>
              <div class="card-subtitle">Actions performed in order</div>
            </div>
            <button id="btnAddTask" class="btn btn-sm btn-tonal">+ Add Task</button>
          </div>

          <div id="taskList" class="item-list"></div>

          <div class="card-footer">
            <button id="btnSaveWorkflow" class="btn btn-primary">Save Workflow</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel panel-preview">
      <div class="card preview-card">
        <div class="card-bar">
          <div class="preview-title">
            <span>Device Preview</span>
            <span id="screenDimensions" class="tag-dim">1080×2408</span>
          </div>
          <div class="preview-controls">
            <button id="btnDeviceBack" class="btn btn-xs btn-tonal">Back</button>
            <button id="btnDeviceHome" class="btn btn-xs btn-tonal">Home</button>
            <button id="btnRefreshScreen" class="btn btn-xs btn-tonal">Refresh</button>
            <label class="toggle-row mini">
              <input type="checkbox" id="autoRefreshToggle" checked>
              <span>Live</span>
            </label>
          </div>
        </div>

        <div class="phone-wrapper">
          <div class="phone-frame">
            <div class="phone-camera"></div>
            <div class="screen-canvas" id="screenContainer">
              <img id="deviceScreenImg" src="/api/device/screenshot" alt="Device Screen">
              <div id="screenTapIndicator" class="tap-circle"></div>
            </div>
          </div>
          <div class="help-text">Click anywhere on screen to tap that spot on phone</div>
        </div>
      </div>

      <div class="card log-card">
        <div class="card-bar">
          <div class="card-title">Log</div>
          <div class="log-controls">
            <label class="toggle-row mini">
              <input type="checkbox" id="logAutoScroll" checked>
              <span>Auto-scroll</span>
            </label>
            <button id="btnClearLogs" class="btn btn-xs btn-tonal">Clear</button>
          </div>
        </div>
        <div id="activityLog" class="log-box"></div>
      </div>
    </div>
  </main>

  <div id="taskModal" class="modal-layer">
    <div class="modal-box">
      <div class="modal-header">
        <div id="taskModalTitle" class="modal-title">Edit Task</div>
        <button id="btnModalClose" class="btn-icon">✕</button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="editTaskId">
        <div class="field">
          <label for="taskNameInput">Task Label</label>
          <input type="text" id="taskNameInput" class="input-text" placeholder="e.g. Next Reel">
        </div>

        <div class="field">
          <label for="taskTypeSelect">Action Type</label>
          <select id="taskTypeSelect" class="clean-select">
            <option value="swipe_next_reel">Swipe Next Reel</option>
            <option value="open_url">Open URL in Browser</option>
            <option value="search_topic">Search Topic</option>
            <option value="human_scroll">Scroll Screen</option>
            <option value="tap_element">Tap UI Element</option>
            <option value="find_and_click_more">Click 'More' Button</option>
            <option value="tap_coords">Tap Coordinates</option>
            <option value="enter_text">Enter Text</option>
            <option value="press_back">Press Back</option>
            <option value="press_key">Press Key</option>
            <option value="wait_inspect">Wait & Inspect</option>
            <option value="launch_app">Launch Application</option>
            <option value="cooldown">Cooldown Pause</option>
          </select>
        </div>

        <div id="taskParamsContainer" class="params-box"></div>

        <div class="grid-fields">
          <div class="field">
            <label for="taskOnFailure">On Failure</label>
            <select id="taskOnFailure" class="clean-select">
              <option value="continue">Continue</option>
              <option value="retry">Retry</option>
              <option value="abort">Abort</option>
            </select>
          </div>
          <div class="field">
            <label for="taskRetries">Max Retries</label>
            <input type="number" id="taskRetries" class="input-text" min="1" max="5" value="1">
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button id="btnModalCancel" class="btn btn-tonal">Cancel</button>
        <button id="btnModalSave" class="btn btn-primary">Save Task</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>

</html>
